services:
  # -------------------------------------------------------------
  # 1. Backend API (Node / Express Web Service)
  # -------------------------------------------------------------
  - type: web
    name: studio-loom-razorpay-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build -w server
    startCommand: npm run start -w server
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-2.5-flash
      - key: MAX_ORDER_VALUE
        value: 50000
      - key: APPROVAL_THRESHOLD
        value: 10000
      - key: CLIENT_URL
        fromStaticSite:
          name: studio-loom-razorpay-frontend
          type: url

  # -------------------------------------------------------------
  # 2. Frontend Storefront (Vite / React Static Site)
  # -------------------------------------------------------------
  - type: static
    name: studio-loom-razorpay-frontend
    plan: free
    region: oregon
    buildCommand: npm install && npm run build -w client
    staticPublishPath: client/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: studio-loom-razorpay-backend
          property: url
          format: ${value}/api
